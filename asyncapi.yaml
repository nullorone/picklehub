asyncapi: 3.1.0
info:
    title: PickleHub WebSocket API
    version: 0.1.0
    description: >
        Versioned protocol envelopes for the PickleHub WebSocket connection.
        Authentication uses a short-lived,

        single-use ticket obtained through authenticated REST. The ticket is sent
        only in the first protocol message,

        never in a URL or log. Domain events use separate internal outbox channels
        and are never broadcast to WebSocket clients.
    license:
        name: Proprietary
defaultContentType: application/json
servers:
    local:
        host: localhost:3000
        protocol: ws
        description: Local development server; deployment hosts are supplied by
            environment configuration.
    outbox:
        host: localhost:5432
        protocol: postgresql
        description: Internal transactional outbox transport, accessible only to backend
            workloads. Not a client subscription API.
    jobs:
        host: localhost:6379
        protocol: redis
        description: Internal BullMQ transport. Jobs carry opaque identifiers only and are not a client API.
channels:
    control:
        address: /v1/ws
        title: Connection control channel
        description: Bidirectional protocol channel used before and after an
            authenticated connection is established.
        servers:
            - $ref: '#/servers/local'
        messages:
            Authenticate:
                $ref: '#/components/messages/Authenticate'
            Authenticated:
                $ref: '#/components/messages/Authenticated'
            ProtocolError:
                $ref: '#/components/messages/ProtocolError'
            Ping:
                $ref: '#/components/messages/Ping'
            Pong:
                $ref: '#/components/messages/Pong'
    matchChat:
        address: /v1/ws
        title: Authorized match chat stream
        description: Client commands and at-least-once server events. The server authorizes every subscribe,
            resume, mutation and fan-out against current membership. Sequence gaps require REST catch-up or a
            fresh snapshot; WebSocket delivery is never the source of truth.
        servers:
            - $ref: '#/servers/local'
        messages:
            ChatSubscribe: { $ref: '#/components/messages/ChatSubscribe' }
            ChatMessageCreateCommand: { $ref: '#/components/messages/ChatMessageCreateCommand' }
            ChatMessageUpdateCommand: { $ref: '#/components/messages/ChatMessageUpdateCommand' }
            ChatMessageDeleteCommand: { $ref: '#/components/messages/ChatMessageDeleteCommand' }
            ChatSubscribed: { $ref: '#/components/messages/ChatSubscribed' }
            ChatMessageCreated: { $ref: '#/components/messages/ChatMessageCreated' }
            ChatMessageUpdated: { $ref: '#/components/messages/ChatMessageUpdated' }
            ChatMessageDeleted: { $ref: '#/components/messages/ChatMessageDeleted' }
            ChatSystemEvent: { $ref: '#/components/messages/ChatSystemEvent' }
            CommunicationError: { $ref: '#/components/messages/CommunicationError' }
    notificationStream:
        address: /v1/ws
        title: Authorized notification stream
        description: At-least-once foreground signal for an authenticated user's persistent inbox. The server
            authorizes before each fan-out; clients deduplicate by messageId and fetch REST after a gap.
        servers:
            - $ref: '#/servers/local'
        messages:
            NotificationCreated: { $ref: '#/components/messages/NotificationCreated' }
            CommunicationError: { $ref: '#/components/messages/CommunicationError' }
    communicationEvents:
        address: communication.events.v1
        title: Internal privacy-minimized communication events
        description: Transactional outbox only. Message text, revisions, evidence, routes, contacts and provider
            payloads are forbidden; consumers load authorized content from owning storage by opaque ID.
        servers:
            - $ref: '#/servers/outbox'
        messages:
            ChatStreamChanged: { $ref: '#/components/messages/ChatStreamChanged' }
            NotificationFanoutRequested: { $ref: '#/components/messages/NotificationFanoutRequested' }
    notificationDeliveryJobs:
        address: notification-delivery-v1
        title: Internal notification delivery jobs
        description: BullMQ at-least-once jobs. The stable delivery ID is the job id; a worker claims the delivery
            row, reloads current preference/contact/template data and keeps the same provider idempotency key on
            retry or approved same-channel failover.
        servers:
            - $ref: '#/servers/jobs'
        messages:
            NotificationDeliveryRequested: { $ref: '#/components/messages/NotificationDeliveryRequested' }
    identityEvents:
        address: identity.events.v1
        title: Internal identity domain events
        description: Transactional outbox only. No public WebSocket subscription;
            at-least-once delivery, deduplicate by messageId. No global ordering
            guarantee.
        servers:
            - $ref: '#/servers/outbox'
        messages:
            IdentityLinked:
                $ref: '#/components/messages/IdentityLinked'
            IdentityUnlinked:
                $ref: '#/components/messages/IdentityUnlinked'
            SessionsRevoked:
                $ref: '#/components/messages/SessionsRevoked'
            OnboardingCompleted:
                $ref: '#/components/messages/OnboardingCompleted'
            ConsentChanged:
                $ref: '#/components/messages/ConsentChanged'
            AccountDeletionRequested:
                $ref: '#/components/messages/AccountDeletionRequested'
    venueEvents:
        address: venue.events.v1
        title: Internal venue domain events
        description: Transactional outbox only. At-least-once delivery; consumers
            deduplicate by messageId. Payloads contain opaque IDs and bounded states,
            never addresses, coordinates, search origins or contributor identities.
        servers:
            - $ref: '#/servers/outbox'
        messages:
            VenueCandidateCreated:
                $ref: '#/components/messages/VenueCandidateCreated'
            VenueVerified:
                $ref: '#/components/messages/VenueVerified'
            VenueMerged:
                $ref: '#/components/messages/VenueMerged'
    matchEvents:
        address: match.events.v1
        title: Internal match domain events
        description: Transactional outbox only, ordered by match aggregate version and delivered at least once.
            Payloads contain opaque IDs and closed enums only; no invite token, roster identity, score, text,
            level, venue, coordinates, search origin or dispute reason.
        servers:
            - $ref: '#/servers/outbox'
        messages:
            MatchCreated:
                $ref: '#/components/messages/MatchCreated'
            MatchPublished:
                $ref: '#/components/messages/MatchPublished'
            MatchJoinIntentRecorded:
                $ref: '#/components/messages/MatchJoinIntentRecorded'
            MatchRosterChanged:
                $ref: '#/components/messages/MatchRosterChanged'
            MatchStarted:
                $ref: '#/components/messages/MatchStarted'
            MatchResultProposed:
                $ref: '#/components/messages/MatchResultProposed'
            MatchResultDisputed:
                $ref: '#/components/messages/MatchResultDisputed'
            MatchCompletedConfirmed:
                $ref: '#/components/messages/MatchCompletedConfirmed'
            MatchCancelled:
                $ref: '#/components/messages/MatchCancelled'
    profileEvents:
        address: profile.events.v1
        title: Internal profile and statistics projection events
        description: Transactional outbox only, delivered at least once and deduplicated by messageId plus source
            revision. Payloads contain opaque references and closed states only; names, locality, level, DUPR URL,
            avatar key, score, player totals, report evidence and block direction are forbidden.
        servers:
            - $ref: '#/servers/outbox'
        messages:
            ProfileChanged: { $ref: '#/components/messages/ProfileChanged' }
            ProfileStatisticsSourceChanged: { $ref: '#/components/messages/ProfileStatisticsSourceChanged' }
            ProfileStatisticsRebuildRequested: { $ref: '#/components/messages/ProfileStatisticsRebuildRequested' }
            ProfileStatisticsRebuildCompleted: { $ref: '#/components/messages/ProfileStatisticsRebuildCompleted' }
    trustSafetyEvents:
        address: trust-safety.events.v1
        title: Internal privacy-minimized trust and safety events
        description: Transactional outbox only, delivered at least once. Payloads contain one opaque aggregate ID
            and a broad report category; reporter, subject, source, reason, text, rating, evidence, decision detail,
            block direction and attachments are forbidden. Authorized consumers reload the minimum necessary data.
        servers:
            - $ref: '#/servers/outbox'
        messages:
            SafetySignalReceived: { $ref: '#/components/messages/SafetySignalReceived' }
            SafetyCaseStatusChanged: { $ref: '#/components/messages/SafetyCaseStatusChanged' }
            SafetyDecisionRecorded: { $ref: '#/components/messages/SafetyDecisionRecorded' }
            SafetyEffectRequested: { $ref: '#/components/messages/SafetyEffectRequested' }
    reviewEvents:
        address: review.events.v1
        title: Internal review eligibility events
        description: Transactional outbox only. Carries an opaque review ID and monotonic revision; rating, tags,
            text, author, subject and match identity remain in owning storage and are reloaded by an authorized worker.
        servers:
            - $ref: '#/servers/outbox'
        messages:
            ReviewEligibilityChanged: { $ref: '#/components/messages/ReviewEligibilityChanged' }
    clubEvents:
        address: club.events.v1
        title: Internal privacy-minimized club events
        description: Transactional outbox only, ordered by club aggregate version and delivered at least once.
            Every payload includes clubId and opaque aggregate references with closed states only; member identity,
            invitation token, club text, member graph, venue coordinates, roster, reason and exact schedule are forbidden.
        servers:
            - $ref: '#/servers/outbox'
        messages:
            ClubCreated: { $ref: '#/components/messages/ClubCreated' }
            ClubStateChanged: { $ref: '#/components/messages/ClubStateChanged' }
            ClubMembershipChanged: { $ref: '#/components/messages/ClubMembershipChanged' }
            ClubVenueLinkChanged: { $ref: '#/components/messages/ClubVenueLinkChanged' }
            ClubRecurringRuleChanged: { $ref: '#/components/messages/ClubRecurringRuleChanged' }
            ClubRecurringOccurrenceRecorded: { $ref: '#/components/messages/ClubRecurringOccurrenceRecorded' }
    tournamentEvents:
        address: tournament.events.v1
        title: Internal privacy-minimized tournament events
        description: Transactional outbox only, delivered at least once and deduplicated by messageId. Payloads
            carry aggregate/resource revisions and closed states, never roster, payment, score, seed, exact schedule,
            location, public text, actor identity or correction reason. Consumers reload an authorized projection.
        servers:
            - $ref: '#/servers/outbox'
        messages:
            TournamentCreated: { $ref: '#/components/messages/TournamentCreated' }
            TournamentStateChanged: { $ref: '#/components/messages/TournamentStateChanged' }
            TournamentEntrantChanged: { $ref: '#/components/messages/TournamentEntrantChanged' }
            TournamentPlanChanged: { $ref: '#/components/messages/TournamentPlanChanged' }
            TournamentResultChanged: { $ref: '#/components/messages/TournamentResultChanged' }
    gamificationEvents:
        address: gamification.events.v1
        title: Internal privacy-minimized gamification projection events
        description: Transactional outbox only, delivered at least once and deduplicated by messageId. Payloads
            contain opaque projection records and closed states only; user, club, source activity, score, winner,
            opponent graph, XP amount, rank, display identity, fraud reason and evidence are forbidden.
        servers:
            - $ref: '#/servers/outbox'
        messages:
            XpLedgerEntryRecorded: { $ref: '#/components/messages/XpLedgerEntryRecorded' }
            AchievementAwardChanged: { $ref: '#/components/messages/AchievementAwardChanged' }
            LeaderboardConsentChanged: { $ref: '#/components/messages/LeaderboardConsentChanged' }
            LeaderboardProjectionChanged: { $ref: '#/components/messages/LeaderboardProjectionChanged' }
    miniGameEvents:
        address: mini-game.events.v1
        title: Internal privacy-minimized mini-game receipt and reward events
        description: Transactional outbox only, delivered at least once and deduplicated by messageId. Payloads
            contain opaque receipt/grant/unlock references and closed outcomes only; user/session/task, challenge,
            nonce, score, counters, mode, timing, cosmetic inventory and abuse reasons are forbidden. The XP
            consumer reloads an authorized GLOBAL-only grant and applies MINI_GAME_DAILY_COMPLETION policy.
        servers:
            - $ref: '#/servers/outbox'
        messages:
            MiniGameResultRecorded: { $ref: '#/components/messages/MiniGameResultRecorded' }
            MiniGameRewardGrantChanged: { $ref: '#/components/messages/MiniGameRewardGrantChanged' }
            MiniGameCosmeticUnlockChanged: { $ref: '#/components/messages/MiniGameCosmeticUnlockChanged' }
    contentEvents:
        address: content.events.v1
        title: Internal privacy-minimized content publication events
        description: Transactional outbox only, delivered at least once and deduplicated by messageId. Payloads
            contain opaque article/revision references, aggregate version and a closed outcome only; title, body,
            excerpt, slug, URL, author, source evidence, staff identity and bookmark graph are forbidden.
        servers:
            - $ref: '#/servers/outbox'
        messages:
            ContentArticlePublished: { $ref: '#/components/messages/ContentArticlePublished' }
            ContentArticleUnpublished: { $ref: '#/components/messages/ContentArticleUnpublished' }
    advertisingEvents:
        address: advertising.events.v1
        title: Internal privacy-minimized advertising delivery events
        description: Transactional outbox only, delivered at least once and deduplicated by messageId. Payloads
            distinguish issuance, viewable impression and valid click using opaque inventory references only. Cap
            subjects, identity, session/device/ad identifiers, IP, coordinates, URL/query and creative content are forbidden.
        servers:
            - $ref: '#/servers/outbox'
        messages:
            AdvertisingDeliveryIssued: { $ref: '#/components/messages/AdvertisingDeliveryIssued' }
            AdvertisingImpressionViewable: { $ref: '#/components/messages/AdvertisingImpressionViewable' }
            AdvertisingClickValidated: { $ref: '#/components/messages/AdvertisingClickValidated' }
operations:
    receiveClientControl:
        action: receive
        title: Receive client control messages
        summary: Accept authentication and heartbeat messages from a client.
        description: Authenticate must be the first message; any other message before
            authentication closes the connection.
        channel:
            $ref: '#/channels/control'
        messages:
            - $ref: '#/channels/control/messages/Authenticate'
            - $ref: '#/channels/control/messages/Ping'
    sendServerControl:
        action: send
        title: Send server control messages
        summary: Send authentication results, safe protocol errors and heartbeat replies.
        description: Protocol errors never expose credentials, stack traces, provider
            responses or sensitive payloads.
        channel:
            $ref: '#/channels/control'
        messages:
            - $ref: '#/channels/control/messages/Authenticated'
            - $ref: '#/channels/control/messages/ProtocolError'
            - $ref: '#/channels/control/messages/Pong'
    receiveChatCommands:
        action: receive
        title: Receive authorized chat commands
        summary: Subscribe, resume, create, edit or delete within one match conversation.
        description: Authentication precedes every command. Command idempotency keys are stable UUIDv4 values;
            duplicate commands return/replay the same committed revision and sequence.
        channel: { $ref: '#/channels/matchChat' }
        messages:
            - $ref: '#/channels/matchChat/messages/ChatSubscribe'
            - $ref: '#/channels/matchChat/messages/ChatMessageCreateCommand'
            - $ref: '#/channels/matchChat/messages/ChatMessageUpdateCommand'
            - $ref: '#/channels/matchChat/messages/ChatMessageDeleteCommand'
    sendChatEvents:
        action: send
        title: Send authorized chat events
        summary: Send subscription state, message changes, system events and safe errors at least once.
        channel: { $ref: '#/channels/matchChat' }
        messages:
            - $ref: '#/channels/matchChat/messages/ChatSubscribed'
            - $ref: '#/channels/matchChat/messages/ChatMessageCreated'
            - $ref: '#/channels/matchChat/messages/ChatMessageUpdated'
            - $ref: '#/channels/matchChat/messages/ChatMessageDeleted'
            - $ref: '#/channels/matchChat/messages/ChatSystemEvent'
            - $ref: '#/channels/matchChat/messages/CommunicationError'
    sendNotificationEvents:
        action: send
        title: Signal persistent in-app notifications
        summary: Signal an authorized inbox change without claiming human read or external delivery.
        channel: { $ref: '#/channels/notificationStream' }
        messages:
            - $ref: '#/channels/notificationStream/messages/NotificationCreated'
            - $ref: '#/channels/notificationStream/messages/CommunicationError'
    publishCommunicationEvents:
        action: send
        title: Publish committed communication changes
        summary: Publish opaque references through the transactional outbox for idempotent consumers.
        channel: { $ref: '#/channels/communicationEvents' }
        messages:
            - $ref: '#/channels/communicationEvents/messages/ChatStreamChanged'
            - $ref: '#/channels/communicationEvents/messages/NotificationFanoutRequested'
    processNotificationDeliveryJobs:
        action: receive
        title: Process notification delivery attempts
        summary: Claim a logical delivery by stable job id and perform bounded at-least-once attempts.
        channel: { $ref: '#/channels/notificationDeliveryJobs' }
        messages:
            - $ref: '#/channels/notificationDeliveryJobs/messages/NotificationDeliveryRequested'
    publishIdentityEvents:
        action: send
        title: Publish committed identity changes
        summary: Publish safe identity events through the internal transactional outbox.
        description: Persist event atomically with the owning mutation. Stable messageId
            survives retries; consumers deduplicate and authorize internal workload
            access. These are mandatory domain events, not optional product analytics.
        channel:
            $ref: '#/channels/identityEvents'
        messages:
            - $ref: '#/channels/identityEvents/messages/IdentityLinked'
            - $ref: '#/channels/identityEvents/messages/IdentityUnlinked'
            - $ref: '#/channels/identityEvents/messages/SessionsRevoked'
            - $ref: '#/channels/identityEvents/messages/OnboardingCompleted'
            - $ref: '#/channels/identityEvents/messages/ConsentChanged'
            - $ref: '#/channels/identityEvents/messages/AccountDeletionRequested'
    publishVenueEvents:
        action: send
        title: Publish committed venue changes
        summary: Publish safe venue events through the internal transactional outbox.
        description: Persist the event atomically with the owning venue mutation.
            Stable messageId survives retries. No address, coordinate, source payload,
            search origin or contributor identity is copied into these events.
        channel:
            $ref: '#/channels/venueEvents'
        messages:
            - $ref: '#/channels/venueEvents/messages/VenueCandidateCreated'
            - $ref: '#/channels/venueEvents/messages/VenueVerified'
            - $ref: '#/channels/venueEvents/messages/VenueMerged'
    publishMatchEvents:
        action: send
        title: Publish committed match transitions
        summary: Publish privacy-minimized match events through the transactional outbox.
        description: The stream key is match:{matchId}; aggregateVersion supplies monotonic ordering. Consumers
            deduplicate by messageId and never infer a successful mutation before its REST response/commit.
        channel:
            $ref: '#/channels/matchEvents'
        messages:
            - $ref: '#/channels/matchEvents/messages/MatchCreated'
            - $ref: '#/channels/matchEvents/messages/MatchPublished'
            - $ref: '#/channels/matchEvents/messages/MatchJoinIntentRecorded'
            - $ref: '#/channels/matchEvents/messages/MatchRosterChanged'
            - $ref: '#/channels/matchEvents/messages/MatchStarted'
            - $ref: '#/channels/matchEvents/messages/MatchResultProposed'
            - $ref: '#/channels/matchEvents/messages/MatchResultDisputed'
            - $ref: '#/channels/matchEvents/messages/MatchCompletedConfirmed'
            - $ref: '#/channels/matchEvents/messages/MatchCancelled'
    publishProfileEvents:
        action: send
        title: Publish profile and projection lifecycle changes
        summary: Publish privacy-minimized references through the transactional outbox.
        description: Profile mutations commit their event atomically. Statistics source changes carry only an
            opaque source and monotonic revision; the authorized consumer reloads matches or trust decisions.
            Rebuild completion does not expose a player, score, totals or source match identifiers.
        channel: { $ref: '#/channels/profileEvents' }
        messages:
            - $ref: '#/channels/profileEvents/messages/ProfileChanged'
            - $ref: '#/channels/profileEvents/messages/ProfileStatisticsSourceChanged'
            - $ref: '#/channels/profileEvents/messages/ProfileStatisticsRebuildRequested'
            - $ref: '#/channels/profileEvents/messages/ProfileStatisticsRebuildCompleted'
    publishTrustSafetyEvents:
        action: send
        title: Publish committed trust and safety lifecycle references
        summary: Publish only opaque IDs and broad report categories through the transactional outbox.
        description: Each mutation commits its event atomically. Consumers deduplicate by messageId and perform an
            authorized source read; neither the event nor a retry/DLQ payload contains people, evidence or reasons.
        channel: { $ref: '#/channels/trustSafetyEvents' }
        messages:
            - $ref: '#/channels/trustSafetyEvents/messages/SafetySignalReceived'
            - $ref: '#/channels/trustSafetyEvents/messages/SafetyCaseStatusChanged'
            - $ref: '#/channels/trustSafetyEvents/messages/SafetyDecisionRecorded'
            - $ref: '#/channels/trustSafetyEvents/messages/SafetyEffectRequested'
    publishReviewEvents:
        action: send
        title: Publish review eligibility changes
        summary: Reconcile structured-review rewards from an opaque authoritative reference.
        description: The owning review mutation commits this reference atomically; consumers deduplicate by
            messageId and revision and never copy review content or identities into the event.
        channel: { $ref: '#/channels/reviewEvents' }
        messages:
            - $ref: '#/channels/reviewEvents/messages/ReviewEligibilityChanged'
    publishClubEvents:
        action: send
        title: Publish committed club lifecycle references
        summary: Publish club-scoped opaque IDs and closed states through the transactional outbox.
        description: Mutations commit their event atomically. Consumers deduplicate by messageId and reload any
            authorized projection; no identity, token, public text, coordinates, roster, reason or local schedule travels.
        channel: { $ref: '#/channels/clubEvents' }
        messages:
            - $ref: '#/channels/clubEvents/messages/ClubCreated'
            - $ref: '#/channels/clubEvents/messages/ClubStateChanged'
            - $ref: '#/channels/clubEvents/messages/ClubMembershipChanged'
            - $ref: '#/channels/clubEvents/messages/ClubVenueLinkChanged'
            - $ref: '#/channels/clubEvents/messages/ClubRecurringRuleChanged'
            - $ref: '#/channels/clubEvents/messages/ClubRecurringOccurrenceRecorded'
    publishTournamentEvents:
        action: send
        title: Publish committed tournament aggregate changes
        summary: Publish only opaque references, monotonic revisions and closed states through the outbox.
        description: Each message is committed with its audit and aggregate mutation. Replay is safe by messageId,
            aggregate version and resource revision; bracket consumers rebuild from the authorized source snapshot.
        channel: { $ref: '#/channels/tournamentEvents' }
        messages:
            - $ref: '#/channels/tournamentEvents/messages/TournamentCreated'
            - $ref: '#/channels/tournamentEvents/messages/TournamentStateChanged'
            - $ref: '#/channels/tournamentEvents/messages/TournamentEntrantChanged'
            - $ref: '#/channels/tournamentEvents/messages/TournamentPlanChanged'
            - $ref: '#/channels/tournamentEvents/messages/TournamentResultChanged'
    publishGamificationEvents:
        action: send
        title: Publish committed gamification projection changes
        summary: Publish opaque ledger, award, consent and leaderboard references through the outbox.
        description: Stable messageId and referenced revision make replay safe. Authorized consumers reload the
            owner-aware projection; no private source activity or public identity is present in the event.
        channel: { $ref: '#/channels/gamificationEvents' }
        messages:
            - $ref: '#/channels/gamificationEvents/messages/XpLedgerEntryRecorded'
            - $ref: '#/channels/gamificationEvents/messages/AchievementAwardChanged'
            - $ref: '#/channels/gamificationEvents/messages/LeaderboardConsentChanged'
            - $ref: '#/channels/gamificationEvents/messages/LeaderboardProjectionChanged'
    publishMiniGameEvents:
        action: send
        title: Publish committed mini-game receipt and reward changes
        summary: Publish opaque terminal and append-only reward references through the internal outbox.
        description: Each event commits with its owning record. Consumers deduplicate by messageId, reload through
            an authorized port and never infer sporting skill or trust from a mini-game outcome.
        channel: { $ref: '#/channels/miniGameEvents' }
        messages:
            - $ref: '#/channels/miniGameEvents/messages/MiniGameResultRecorded'
            - $ref: '#/channels/miniGameEvents/messages/MiniGameRewardGrantChanged'
            - $ref: '#/channels/miniGameEvents/messages/MiniGameCosmeticUnlockChanged'
    publishContentEvents:
        action: send
        title: Publish committed article visibility changes
        summary: Publish only opaque publication references and closed outcomes through the outbox.
        description: The event is committed with the publication pointer. Consumers deduplicate by messageId and
            reload an authorized published projection; the event never transports article content or provenance.
        channel: { $ref: '#/channels/contentEvents' }
        messages:
            - $ref: '#/channels/contentEvents/messages/ContentArticlePublished'
            - $ref: '#/channels/contentEvents/messages/ContentArticleUnpublished'
    publishAdvertisingEvents:
        action: send
        title: Publish committed advertising delivery changes
        summary: Publish opaque issuance, viewability and click facts through the internal outbox.
        description: Consumers deduplicate by messageId and deliveryId. Events contain no cap subject, identity,
            exact context, landing destination, creative content or fraud evidence and expire under delivery retention.
        channel: { $ref: '#/channels/advertisingEvents' }
        messages:
            - $ref: '#/channels/advertisingEvents/messages/AdvertisingDeliveryIssued'
            - $ref: '#/channels/advertisingEvents/messages/AdvertisingImpressionViewable'
            - $ref: '#/channels/advertisingEvents/messages/AdvertisingClickValidated'
components:
    messages:
        Authenticate:
            name: session.authenticate.v1
            title: Authenticate connection
            summary: Present a single-use WebSocket ticket as the first client message.
            contentType: application/json
            correlationId:
                location: $message.payload#/correlationId
            payload:
                $ref: '#/components/schemas/AuthenticateEnvelope'
            examples:
                - name: validTicket
                  summary: Client presents a short-lived ticket.
                  payload:
                      messageId: 0181f32c-7b4a-4f35-8f30-c358f278cb9e
                      type: session.authenticate.v1
                      occurredAt: 2026-09-03T09:15:30.000Z
                      correlationId: 142f1089-c4e5-4594-8b8d-208d861ba762
                      data:
                          ticket: ws1_I3eYQ7mtJYg-7itjEjCB3GC-d8V3mQe0
        Authenticated:
            name: session.authenticated.v1
            title: Connection authenticated
            summary: Confirm the authenticated connection and its resume boundary.
            contentType: application/json
            correlationId:
                location: $message.payload#/correlationId
            payload:
                $ref: '#/components/schemas/AuthenticatedEnvelope'
            examples:
                - name: authenticated
                  summary: Server accepts the ticket.
                  payload:
                      messageId: 0181f32c-7b4a-4f35-8f30-c358f278cb9f
                      type: session.authenticated.v1
                      occurredAt: 2026-09-03T09:15:30.100Z
                      correlationId: 142f1089-c4e5-4594-8b8d-208d861ba762
                      causationId: 0181f32c-7b4a-4f35-8f30-c358f278cb9e
                      data:
                          connectionId: f16d12e1-2325-490f-92d8-24037bcb9292
                          resumeCursor: null
        ProtocolError:
            name: protocol.error.v1
            title: Protocol error
            summary: Report a stable, safe WebSocket protocol error.
            contentType: application/json
            correlationId:
                location: $message.payload#/correlationId
            payload:
                $ref: '#/components/schemas/ProtocolErrorEnvelope'
            examples:
                - name: authenticationRequired
                  summary: A client sent a message before authenticating.
                  payload:
                      messageId: 0181f32c-7b4a-4f35-8f30-c358f278cba0
                      type: protocol.error.v1
