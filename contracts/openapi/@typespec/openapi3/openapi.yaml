openapi: 3.0.0
info:
  title: PickleHub Game API
  version: 0.0.0
tags: []
paths:
  /games:
    get:
      operationId: Games_list
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: limit
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PageSize'
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GamePage'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
      security:
        - BearerAuth: []
    post:
      operationId: Games_create
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/IdempotencyKey'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameDetail'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGameRequest'
      security:
        - BearerAuth: []
  /games/{gameId}:
    get:
      operationId: Games_get
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameDetail'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '410':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelledError'
      security:
        - BearerAuth: []
    patch:
      operationId: Games_update
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/IdempotencyKey'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameDetail'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
        '410':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelledError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGameRequest'
      security:
        - BearerAuth: []
  /games/{gameId}/cancellation:
    post:
      operationId: Games_cancel
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/IdempotencyKey'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameDetail'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
      security:
        - BearerAuth: []
  /games/{gameId}/participants/{userId}:
    delete:
      operationId: Games_removeParticipant
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
        - name: userId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/IdempotencyKey'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameDetail'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
        '410':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelledError'
      security:
        - BearerAuth: []
  /games/{gameId}/participation:
    put:
      operationId: Games_join
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/IdempotencyKey'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameDetail'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
        '410':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelledError'
      security:
        - BearerAuth: []
    delete:
      operationId: Games_leave
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/IdempotencyKey'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameDetail'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
        '410':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelledError'
      security:
        - BearerAuth: []
  /sessions/telegram:
    post:
      operationId: TelegramSessions_create
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramSession'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramSessionRequest'
  /venues:
    get:
      operationId: Venues_list
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VenueCatalog'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
      security:
        - BearerAuth: []
components:
  schemas:
    CancelledError:
      type: object
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
    ConflictError:
      type: object
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
    CreateGameRequest:
      type: object
      required:
        - venueName
        - venueAddress
        - startsAt
        - durationMinutes
        - participantLimit
        - organizerParticipates
      properties:
        venueName:
          $ref: '#/components/schemas/VenueName'
        venueAddress:
          $ref: '#/components/schemas/VenueAddress'
        startsAt:
          type: string
          format: date-time
        durationMinutes:
          $ref: '#/components/schemas/DurationMinutes'
        participantLimit:
          $ref: '#/components/schemas/ParticipantLimit'
        organizerParticipates:
          type: boolean
          default: true
        desiredLevel:
          $ref: '#/components/schemas/DesiredLevel'
        description:
          $ref: '#/components/schemas/GameDescription'
    DesiredLevel:
      type: string
      minLength: 1
      maxLength: 80
    DisplayName:
      type: string
      minLength: 1
      maxLength: 120
    DurationMinutes:
      type: integer
      format: int32
      minimum: 30
      maximum: 480
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - FORBIDDEN
        - GAME_NOT_FOUND
        - PARTICIPANT_NOT_FOUND
        - GAME_FULL
        - GAME_CONFLICT
        - IDEMPOTENCY_KEY_REUSED
        - GAME_CANCELLED
        - TELEGRAM_AUTH_INVALID
    ErrorResponse:
      type: object
      required:
        - code
        - message
        - requestId
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        requestId:
          type: string
        details:
          type: object
          additionalProperties: {}
    ForbiddenError:
      type: object
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
    Game:
      type: object
      required:
        - id
        - organizerId
        - organizerParticipates
        - venueName
        - venueAddress
        - startsAt
        - durationMinutes
        - participantLimit
        - participantCount
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        organizerId:
          $ref: '#/components/schemas/uuid'
        organizerParticipates:
          type: boolean
        venueName:
          $ref: '#/components/schemas/VenueName'
        venueAddress:
          $ref: '#/components/schemas/VenueAddress'
        startsAt:
          type: string
          format: date-time
        durationMinutes:
          $ref: '#/components/schemas/DurationMinutes'
        participantLimit:
          $ref: '#/components/schemas/ParticipantLimit'
        participantCount:
          $ref: '#/components/schemas/ParticipantCount'
        status:
          $ref: '#/components/schemas/GameStatus'
        desiredLevel:
          $ref: '#/components/schemas/DesiredLevel'
        description:
          $ref: '#/components/schemas/GameDescription'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    GameDescription:
      type: string
      maxLength: 2000
    GameDetail:
      type: object
      required:
        - participants
      properties:
        participants:
          type: array
          items:
            $ref: '#/components/schemas/Participant'
      allOf:
        - $ref: '#/components/schemas/Game'
    GamePage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Game'
        nextCursor:
          type: string
    GameStatus:
      type: string
      enum:
        - SCHEDULED
        - FULL
        - CANCELLED
    IdempotencyKey:
      type: string
      minLength: 16
      maxLength: 128
    KnownVenue:
      type: object
      required:
        - id
        - name
        - address
      properties:
        id:
          type: string
        name:
          $ref: '#/components/schemas/VenueName'
        address:
          $ref: '#/components/schemas/VenueAddress'
    NotFoundError:
      type: object
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
    PageSize:
      type: integer
      format: int32
      minimum: 1
      maximum: 50
    Participant:
      type: object
      required:
        - userId
        - displayName
        - joinedAt
        - isOrganizer
      properties:
        userId:
          $ref: '#/components/schemas/uuid'
        displayName:
          $ref: '#/components/schemas/DisplayName'
        joinedAt:
          type: string
          format: date-time
        isOrganizer:
          type: boolean
    ParticipantCount:
      type: integer
      format: int32
      minimum: 0
      maximum: 96
    ParticipantLimit:
      type: integer
      format: int32
      minimum: 2
      maximum: 96
    SessionUser:
      type: object
      required:
        - id
        - displayName
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        displayName:
          $ref: '#/components/schemas/DisplayName'
    TelegramSession:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresAt
        - user
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum:
            - Bearer
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/SessionUser'
    TelegramSessionRequest:
      type: object
      required:
        - initData
      properties:
        initData:
          type: string
    UnauthorizedError:
      type: object
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
    UpdateGameRequest:
      type: object
      properties:
        venueName:
          $ref: '#/components/schemas/VenueName'
        venueAddress:
          $ref: '#/components/schemas/VenueAddress'
        startsAt:
          type: string
          format: date-time
        durationMinutes:
          $ref: '#/components/schemas/DurationMinutes'
        participantLimit:
          $ref: '#/components/schemas/ParticipantLimit'
        organizerParticipates:
          type: boolean
        desiredLevel:
          type: string
          allOf:
            - $ref: '#/components/schemas/DesiredLevel'
          nullable: true
        description:
          type: string
          allOf:
            - $ref: '#/components/schemas/GameDescription'
          nullable: true
    ValidationError:
      type: object
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
    VenueAddress:
      type: string
      minLength: 1
      maxLength: 300
    VenueCatalog:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KnownVenue'
    VenueName:
      type: string
      minLength: 1
      maxLength: 120
    uuid:
      type: string
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
  securitySchemes:
    BearerAuth:
      type: http
      scheme: Bearer
      description: Bearer token obtained from a validated Telegram session.
servers:
  - url: https://api.example.invalid
    description: Pilot API
    variables: {}
