            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              required: true
              schema:
                type: string
                enum:
                  - no-cache
            Retry-After:
              required: true
              description: Non-negative whole seconds before the client should retry.
              schema:
                type: integer
                format: int32
                minimum: 0
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                  - requestId
                properties:
                  error:
                    type: object
                    properties:
                      code:
