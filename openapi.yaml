                  - no-store
            Pragma:
              required: true
              schema:
                type: string
                enum:
                  - no-cache
            Retry-After:
              required: true
              description: Non-negative whole seconds before the client should retry.
              schema:
                type: integer
                format: int32
                minimum: 0
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                  - requestId
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                          - RATE_LIMITED
                      message:
                        type: string
                      details:
                        type: array
                        items:
                          $ref: '#/components/schemas/ErrorDetail'
                    required:
                      - code
                      - message
                    unevaluatedProperties:
                      not: {}
                  requestId:
                    $ref: '#/components/schemas/RequestId'
                unevaluatedProperties:
                  not: {}
        '503':
          description: Service unavailable.
          headers:
            X-Request-ID:
              required: true
              description: Server-validated request identifier, also present in response bodies where defined.
              schema:
                $ref: '#/components/schemas/RequestId'
            X-Correlation-ID:
              required: true
              description: Server-validated identifier joining related requests and background work.
              schema:
                $ref: '#/components/schemas/CorrelationId'
            Content-Language:
              required: true
              description: BCP 47 locale used for human-readable text in the response.
              schema:
                $ref: '#/components/schemas/Locale'
            Cache-Control:
              required: true
              schema:
