                type: string
                enum:
                  - no-store
            Pragma:
              required: true
              schema:
                type: string
                enum:
                  - no-cache
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                  - requestId
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                          - VALIDATION_FAILED
                      message:
                        type: string
                      details:
                        type: array
                        items:
                          $ref: '#/components/schemas/ErrorDetail'
                    required:
                      - code
                      - message
                    unevaluatedProperties:
                      not: {}
