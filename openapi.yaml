openapi: 3.1.0
info:
  title: PickleHub REST API
  version: 0.1.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: Contract-first API for PickleHub clients. All timestamps are UTC RFC 3339 instants and all identifiers are opaque. Product endpoints are added only by their owning feature prompts.
tags:
  - name: Health
    description: Process liveness and mandatory dependency readiness.
  - name: Identity
    description: Identity, browser sessions, consent and onboarding.
  - name: Venues
    description: Published venue discovery and player venue contributions.
paths:
  /auth/context:
    get:
      operationId: getBrowserAuthContext
      summary: Obtain a browser CSRF context
      description: 'Same-origin bootstrap (Sec-Fetch-Site or validated Origin); never grant cross-origin read access. Sets __Host-ph-context: Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=3600. Returns an existing valid context or creates a new one; does not create or rotate a session. Rate: 30/minute/IP. No credentials in URL.'
      parameters:
        - name: X-Request-ID
          in: header
          required: false
          description: Optional caller request identifier. Invalid values are ignored and replaced by the server.
          schema:
            $ref: '#/components/schemas/RequestId'
        - name: X-Correlation-ID
          in: header
          required: false
          description: Optional identifier joining work across requests. Invalid values are ignored and replaced.
          schema:
            $ref: '#/components/schemas/CorrelationId'
        - name: Accept-Language
          in: header
          required: false
          description: Preferred BCP 47 response locale. Russian is used when no supported locale matches.
          schema:
            type: string
            minLength: 2
            maxLength: 128
      responses:
        '200':
          description: The request has succeeded.
          headers:
            X-Request-ID:
              required: true
              description: Server-validated request identifier, also present in response bodies where defined.
              schema:
                $ref: '#/components/schemas/RequestId'
            X-Correlation-ID:
              required: true
              description: Server-validated identifier joining related requests and background work.
              schema:
                $ref: '#/components/schemas/CorrelationId'
            Content-Language:
              required: true
              description: BCP 47 locale used for human-readable text in the response.
              schema:
                $ref: '#/components/schemas/Locale'
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              required: true
              schema:
                type: string
                enum:
                  - no-cache
            Set-Cookie:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserContext'
        '400':
          description: The server could not understand the request due to invalid syntax.
          headers:
            X-Request-ID:
              required: true
              description: Server-validated request identifier, also present in response bodies where defined.
              schema:
                $ref: '#/components/schemas/RequestId'
            X-Correlation-ID:
              required: true
              description: Server-validated identifier joining related requests and background work.
              schema:
                $ref: '#/components/schemas/CorrelationId'
            Content-Language:
              required: true
              description: BCP 47 locale used for human-readable text in the response.
              schema:
                $ref: '#/components/schemas/Locale'
            Cache-Control:
              required: true
