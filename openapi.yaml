                type: string
                enum:
                  - no-cache
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                  - requestId
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                          - REQUEST_NOT_ALLOWED
                          - REAUTHENTICATION_REQUIRED
                          - ONBOARDING_REQUIRED
                          - CONSENT_REQUIRED
                      message:
                        type: string
                      details:
                        type: array
                        items:
                          $ref: '#/components/schemas/ErrorDetail'
                    required:
