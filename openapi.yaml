                  - no-cache
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                  - requestId
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                          - IDENTITY_LINK_FAILED
                          - LAST_IDENTITY_REQUIRED
                          - DRAFT_VERSION_CONFLICT
                          - CONSENT_VERSION_CHANGED
                          - IDEMPOTENCY_KEY_REUSED
                      message:
                        type: string
                      details:
                        type: array
                        items:
                          $ref: '#/components/schemas/ErrorDetail'
                    required:
                      - code
                      - message
                    unevaluatedProperties:
                      not: {}
                  requestId:
                    $ref: '#/components/schemas/RequestId'
                unevaluatedProperties:
                  not: {}
        '429':
          description: Client error
          headers:
            X-Request-ID:
              required: true
              description: Server-validated request identifier, also present in response bodies where defined.
              schema:
                $ref: '#/components/schemas/RequestId'
            X-Correlation-ID:
              required: true
              description: Server-validated identifier joining related requests and background work.
              schema:
                $ref: '#/components/schemas/CorrelationId'
            Content-Language:
              required: true
              description: BCP 47 locale used for human-readable text in the response.
              schema:
                $ref: '#/components/schemas/Locale'
            Cache-Control:
              required: true
