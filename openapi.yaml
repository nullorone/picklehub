          schema:
            type: string
            minLength: 2
            maxLength: 128
        - $ref: '#/components/parameters/VenueFilters.accessMode'
        - $ref: '#/components/parameters/VenueFilters.environment'
        - $ref: '#/components/parameters/VenueFilters.permanentNet'
        - $ref: '#/components/parameters/VenueFilters.lighting'
        - $ref: '#/components/parameters/VenueFilters.publicationState'
        - name: cursor
          in: query
          required: false
          description: Opaque base64url cursor returned by the preceding page; clients must not parse or create it.
          schema:
            $ref: '#/components/schemas/Cursor'
          explode: false
        - name: limit
          in: query
          required: false
          description: Maximum number of items requested. Endpoints may document a lower maximum.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
          explode: false
        - name: longitude
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Longitude'
          explode: false
        - name: latitude
