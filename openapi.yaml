                          - REQUEST_NOT_ALLOWED
                          - REAUTHENTICATION_REQUIRED
                          - ONBOARDING_REQUIRED
                          - CONSENT_REQUIRED
                      message:
                        type: string
                      details:
                        type: array
                        items:
                          $ref: '#/components/schemas/ErrorDetail'
                    required:
