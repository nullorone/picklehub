name: Required verification

on:
    pull_request:
    push:
        branches: [master]

permissions:
    contents: read

concurrency:
    group: verification-${{ github.ref }}
    cancel-in-progress: true

jobs:
    contracts:
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.19.0
                  cache: npm
            - run: npm ci --ignore-scripts
            - run: npm run contracts:check

    affected-workspaces:
        runs-on: ubuntu-24.04
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.19.0
                  cache: npm
            - run: npm ci --ignore-scripts
            - run: npm run prisma:generate --workspace @picklehub/backend
              env:
                  PRISMA_SCHEMA_ENGINE_BINARY: /usr/bin/true
                  PRISMA_QUERY_ENGINE_LIBRARY: /usr/bin/true
            - name: Repository policy and formatting
              run: npm run workspace:check && npm run format:check && npm run docs:check && npm run release:policy
            - name: Affected workspace gates
              if: github.event_name == 'pull_request'
              run: npm exec -- turbo run lint typecheck test build --affected
              env:
                  EXPO_NO_TELEMETRY: '1'
            - name: Full main-branch gates
              if: github.event_name != 'pull_request'
              run: npm run lint && npm run typecheck && npm test && npm run build
              env:
                  EXPO_NO_TELEMETRY: '1'

    integration:
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        services:
            postgres:
                image: postgis/postgis:16-3.4
                env:
                    POSTGRES_DB: picklehub
                    POSTGRES_USER: picklehub
                    POSTGRES_PASSWORD: picklehub
                ports: ['5432:5432']
                options: >-
                    --health-cmd "pg_isready -U picklehub -d picklehub"
                    --health-interval 2s
                    --health-timeout 2s
                    --health-retries 20
            redis:
                image: redis:7.4.1-alpine
                ports: ['6379:6379']
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 2s
                    --health-timeout 2s
                    --health-retries 20
        env:
            DATABASE_URL: postgresql://picklehub:picklehub@localhost:5432/picklehub?schema=public
            REDIS_URL: redis://localhost:6379/0
            REDIS_NAMESPACE: ci-${{ github.run_id }}
            NODE_ENV: test
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.19.0
                  cache: npm
            - run: npm ci
            - run: npm run prisma:generate --workspace @picklehub/backend
            - run: npm run prisma:migrate --workspace @picklehub/backend
            - run: npm run test:integration --workspace @picklehub/backend

    browser:
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.19.0
                  cache: npm
            - run: npm ci --ignore-scripts
            - run: npx playwright install --with-deps chromium
            - run: npm run test:e2e

    containers:
        runs-on: ubuntu-24.04
        timeout-minutes: 35
        steps:
            - uses: actions/checkout@v4
            - name: Compose runtime smoke
              run: npm run compose:smoke
            - name: Build commit-bound images
              env:
                  RELEASE_VERSION: 0.0.0-ci.${{ github.run_number }}
              run: |
                  epoch="$(git show -s --format=%ct HEAD)"
                  docker build --build-arg RELEASE_VERSION="$RELEASE_VERSION" --build-arg VCS_REF="$GITHUB_SHA" --build-arg SOURCE_DATE_EPOCH="$epoch" -t picklehub/backend:ci -f backend/Dockerfile .
                  docker build --build-arg RELEASE_VERSION="$RELEASE_VERSION" --build-arg VCS_REF="$GITHUB_SHA" --build-arg SOURCE_DATE_EPOCH="$epoch" -t picklehub/web:ci -f frontend/web/Dockerfile .
                  docker build --build-arg RELEASE_VERSION="$RELEASE_VERSION" --build-arg VCS_REF="$GITHUB_SHA" --build-arg SOURCE_DATE_EPOCH="$epoch" -t picklehub/tma:ci -f frontend/tg/Dockerfile .
            - name: Verify runtime users
              run: |
                  test "$(docker image inspect picklehub/backend:ci --format '{{.Config.User}}')" = node
                  test "$(docker image inspect picklehub/web:ci --format '{{.Config.User}}')" = nginx
                  test "$(docker image inspect picklehub/tma:ci --format '{{.Config.User}}')" = nginx

    supply-chain:
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.19.0
                  cache: npm
            - run: npm ci --ignore-scripts
            - name: Production dependency vulnerabilities
              run: npm audit --omit=dev --audit-level=high
            - name: Production dependency licenses
              run: npm run ci:licenses
            - name: Secret history scan
              uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            - name: Generate CycloneDX inventory
              run: npm sbom --omit=dev --sbom-format cyclonedx > picklehub.cdx.json
            - uses: actions/upload-artifact@v4
              with:
                  name: dependency-inventory-${{ github.sha }}
                  path: picklehub.cdx.json
                  if-no-files-found: error
                  retention-days: 14

    mobile-export:
        runs-on: ubuntu-24.04
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.19.0
                  cache: npm
            - run: npm ci --ignore-scripts
            - name: Audited unsigned iOS and Android exports
              run: npm run build:release:audit --workspace @picklehub/mobile
              env:
                  APP_ENV: production
                  EXPO_NO_TELEMETRY: '1'
                  EXPO_PUBLIC_API_URL: https://api.picklehub.ru/v1
                  EXPO_PUBLIC_MINI_GAME_ORIGIN: https://game.picklehub.ru
            - name: Store publication is deliberately not configured
              run: test ! -f frontend/mobile/eas.json
