add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'self' https://tiles.picklehub.ru; font-src 'self'; form-action 'self'; frame-ancestors https://web.telegram.org https://*.telegram.org; img-src 'self' data: blob: https://tiles.picklehub.ru; manifest-src 'self'; object-src 'none'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:" always;
add_header Cross-Origin-Resource-Policy "same-site" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(), usb=()" always;
add_header Referrer-Policy "no-referrer" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
